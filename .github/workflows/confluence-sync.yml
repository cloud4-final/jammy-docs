# GitHub <-> Confluence 정기 양방향 동기화 (평일 KST 09·18시 및 수동 실행)
name: confluence-sync
on:
  schedule:
    - cron: "0 0,9 * * 1-5"   # 평일 KST 09:00·18:00 (하루 2회)
  workflow_dispatch:
concurrency: confluence-sync
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown-to-confluence==0.6.5
      - name: guard-git-mass-deletion
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: >
          python .github/scripts/check_docs.py README.md contracts.md decisions.md architecture.md mvp-roles.md
          --require-page-id --blocks --max-lines 160 --guard-git-diff
      - name: pull-latest-from-confluence
        env:
          CONFLUENCE_DOMAIN: teamjammyjammy.atlassian.net
          CONFLUENCE_USER_NAME: ${{ secrets.CONFLUENCE_USER_NAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .github/scripts/pull_from_confluence.py --apply
      - name: auto-compact-and-commit-if-changed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python .github/scripts/compact_docs.py contracts.md decisions.md architecture.md mvp-roles.md --max-lines 160
          python .github/scripts/check_docs.py README.md contracts.md decisions.md architecture.md mvp-roles.md --require-page-id --blocks --max-lines 160 --guard-git-diff
          if [ -n "$(git status --porcelain contracts.md decisions.md architecture.md mvp-roles.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts.md decisions.md architecture.md mvp-roles.md
            git commit -m "chore(sync): Confluence 최신 변경 사항 역방향 동기화 및 자동 압축"
            git push origin HEAD:main
          fi
      - name: publish-common-baseline
        env:
          CONFLUENCE_DOMAIN: teamjammyjammy.atlassian.net
          CONFLUENCE_SPACE_KEY: MFS
          CONFLUENCE_USER_NAME: ${{ secrets.CONFLUENCE_USER_NAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
        run: >
          python -m md2conf README.md contracts.md decisions.md architecture.md mvp-roles.md
          --root-page 17334273 --skip-update --no-force-valid-url
          --generated-by "GitHub cloud4-final/jammy-docs에서 자동 생성 · 직접 수정 금지 (평일 09·18시 및 수동 실행 시 양방향 갱신)"
      - name: ai-patch-linked-confluence-pages
        env:
          CONFLUENCE_DOMAIN: teamjammyjammy.atlassian.net
          CONFLUENCE_USER_NAME: ${{ secrets.CONFLUENCE_USER_NAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .github/scripts/ai_patch_confluence.py --apply
      - name: notify-slack-on-failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -c "import sys; sys.path.insert(0, '.github/scripts'); import ai_patch_confluence as ap; ap.send_slack_alert('jammy-docs ↔ Confluence 양방향 동기화 중단 (워크플로 실패)', '대량 삭제 가드 발동, AI 사람 확인 요청(<halt>), 또는 문서 검증 실패로 동기화가 중단되었습니다. Actions 로그를 확인해 주세요.')"
