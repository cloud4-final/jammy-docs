# GitHub -> Confluence 단방향 동기화 및 연결된 기존 Confluence 문서 AI 최신화
name: confluence-sync
on:
  schedule:
    - cron: "0 0,4,9 * * 1-5"   # 평일 KST 09·13·18시
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "contracts.md"
      - "decisions.md"
      - "architecture.md"
      - "mvp-roles.md"
  workflow_dispatch:
concurrency: confluence-sync
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown-to-confluence==0.6.5
      - name: auto-compact-if-over-160-lines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/compact_docs.py contracts.md decisions.md architecture.md mvp-roles.md --max-lines 160
          if [ -n "$(git status --porcelain contracts.md decisions.md architecture.md mvp-roles.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts.md decisions.md architecture.md mvp-roles.md
            git commit -m "chore(docs): 160줄 초과 문서 중요 내용 위주 자동 압축"
            git push origin HEAD:main
          fi
      - name: publish-common-baseline
        env:
          CONFLUENCE_DOMAIN: teamjammyjammy.atlassian.net
          CONFLUENCE_SPACE_KEY: MFS
          CONFLUENCE_USER_NAME: ${{ secrets.CONFLUENCE_USER_NAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
        run: >
          python -m md2conf README.md contracts.md decisions.md architecture.md mvp-roles.md
          --root-page 17334273 --skip-update --no-force-valid-url
          --generated-by "GitHub cloud4-final/jammy-docs에서 자동 생성 · 직접 수정 금지 (평일 09·13·18시 및 merge 시 갱신)"
      - name: ai-patch-linked-confluence-pages
        env:
          CONFLUENCE_DOMAIN: teamjammyjammy.atlassian.net
          CONFLUENCE_USER_NAME: ${{ secrets.CONFLUENCE_USER_NAME }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/ai_patch_confluence.py --apply
