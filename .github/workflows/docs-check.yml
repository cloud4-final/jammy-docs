name: docs-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest==9.2.0 markdown-to-confluence==0.6.5
      - run: python -m pytest .github/scripts/tests -q
      - name: auto-compact-if-over-160-lines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/compact_docs.py contracts.md decisions.md architecture.md mvp-roles.md --max-lines 160
          if [ -n "$(git status --porcelain contracts.md decisions.md architecture.md mvp-roles.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts.md decisions.md architecture.md mvp-roles.md
            git commit -m "chore(docs): 160줄 초과 문서 중요 내용 위주 자동 압축"
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              git push origin HEAD:${{ github.head_ref }}
            fi
          fi
      - run: >
          python .github/scripts/check_docs.py contracts.md decisions.md architecture.md mvp-roles.md --require-page-id --blocks --max-lines 160 --guard-git-diff &&
          python .github/scripts/check_docs.py README.md --require-page-id --max-lines 160 --guard-git-diff
      - name: md2conf-conversion-check
        env:
          CONFLUENCE_DOMAIN: example.atlassian.net
          CONFLUENCE_SPACE_KEY: LOCAL
        run: python -m md2conf README.md contracts.md decisions.md architecture.md mvp-roles.md --local --no-force-valid-url
